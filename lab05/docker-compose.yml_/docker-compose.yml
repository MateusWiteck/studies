version: '3'

services:
    polimongodb1:
        image: mongo:4
        restart: always
        container_name: polimongodb1
        volumes:
        - polimongodata1:/data/db
        expose:
        - "27017"
        entrypoint: [ "/usr/bin/mongod", "--replSet", "rspoli", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1"]

    polimongodb2:
        image: mongo:4
        restart: always
        container_name: polimongodb2
        volumes:
        - polimongodata2:/data/db
        expose:
        - "27017"
        entrypoint: [ "/usr/bin/mongod", "--replSet", "rspoli", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1"]
      
    polimongodb3:
        image: mongo:4
        restart: always
        container_name: polimongodb3
        volumes:
        - polimongodata3:/data/db
        expose:
        - "27017"
        entrypoint: [ "/usr/bin/mongod", "--replSet", "rspoli", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1" ]
        
    

volumes:
    polimongodata1:
    polimongodata2:
    polimongodata3:
